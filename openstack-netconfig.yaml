apiVersion: network.openstack.org/v1beta1
kind: NetConfig
metadata:
  name: openstacknetconfig
  namespace: openstack
spec:
  networks:
  - name: ctlplane
    dnsDomain: ctlplane.rhoso.rhlab.local
    dnsServer: 10.2.32.67
    subnets:
    - name: subnet1
      allocationRanges:
      - end: 10.76.23.43
        start: 10.76.23.40
      #excludeAddresses:
      #- 10.76.23.30
      #- 10.76.23.31
      #- 10.76.23.32
      #- 10.76.23.33
      cidr: 10.76.23.0/24
      gateway: 10.76.23.254  # This remains your primary default gateway for the cluster

  - name: internalapi
    dnsDomain: internalapi.rhoso.rhlab.local
    dnsServer: 10.2.32.67
    vlan: "20"
    subnets:
    - name: subnet1
      allocationRanges:
      - end: 172.16.20.250
        start: 172.16.20.100
      #excludeAddresses:
      #- 172.16.20.10
      #- 172.16.20.11
      #- 172.16.20.12
      #- 172.16.20.13
      cidr: 172.16.20.0/24

  #- name: external
  #  dnsDomain: external.example.com
  #  vlan: "23"
  #  subnets:
  #  - name: subnet1
  #    allocationRanges:
  #    - end: 10.0.0.250
  #      start: 10.0.0.100 # This pool will be consumed by OVN for public endpoints/VIPs
  #    cidr: 10.0.0.0/24
  #    # Note: gateway omitted here to avoid host routing loops. Handled via Neutron topology.

  - name: storage
    dnsDomain: storage.rhoso.rhlab.local
    dnsServer: 10.2.32.67
    vlan: "10"
    subnets:
    - name: subnet1
      allocationRanges:
      - end: 172.16.10.33
        start: 172.16.10.30
      #excludeAddresses:
      #- 172.16.10.30
      #- 172.16.10.31
      #- 172.16.10.32
      #- 172.16.10.33
      cidr: 172.16.10.0/24

  - name: tenant
    dnsDomain: tenant.rhoso.rhlab.local
    dnsServer: 10.2.32.67
    vlan: "21"
    subnets:
    - name: subnet1
      allocationRanges:
      - end: 172.16.21.250
        start: 172.16.21.100
      excludeAddresses:
      #- 172.16.21.10
      #- 172.16.21.11
      #- 172.16.21.12
      #- 172.16.21.13
      cidr: 172.16.21.0/24

