# Point to http://<your-lab-web-server-ip>/images/EFI/BOOT/shimx64.efi
set default=0
set timeout=1

menuentry "OpenShift Agent Installer" {
    echo "Streaming OpenShift Kernel..."
    linuxefi /images/agent.x86_64-vmlinuz ip=dhcp coreos.live.rootfs_url=http://10.76.23.5/images/agent.x86_64-rootfs.img rw ignition.firstboot ignition.platform.id=metal
    echo "Streaming Initial RAM Disk..."
    initrd /images/agent.x86_64-initrd.img
}
