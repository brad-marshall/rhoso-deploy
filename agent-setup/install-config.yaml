apiVersion: v1
baseDomain: rhoso.rhlab.local
metadata:
  name: rhoso-ocp
compute:
- hyperthreading: Enabled
  name: worker
  replicas: 0
controlPlane:
  hyperthreading: Enabled
  name: master
  replicas: 3
networking:
  networkType: OVNKubernetes
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  serviceNetwork:
  - 172.30.0.0/16
  machineNetwork:
  - cidr: 10.76.23.0/24
platform:
  none: {}
pullSecret: '<pull secret json as per README.creds.md>'
sshKey: '<ssh pub key for compute node user>'
